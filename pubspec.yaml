name: flutter_task

description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  equatable: ^2.1.0
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/json/
    - assets/svg/

# Launcher Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
